name: nugaom-forex-customer
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
services:
  web:
    image: nugaom-workspace:${RELEASE_TAG:-local}
    build:
      context: ../../..
      dockerfile: src/forex-mt5/hosting/Dockerfile
    restart: unless-stopped
    logging: *logging
    init: true
    env_file:
      - ${FOREX_ENV_FILE:?Set FOREX_ENV_FILE to the absolute private customer env path}
    environment:
      SITE_HOST: ${SITE_HOST:?Set the public DNS hostname}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      FOREX_MT5_ENABLED: 'true'
      FOREX_MT5_LOCAL_MODE: 'false'
      FOREX_MT5_LOCAL_FILES_PATH: ''
      FOREX_MT5_DATABASE_PATH: /var/lib/nugaom/forex/bridge.sqlite
      FOREX_MT5_PERSISTENT_STORAGE: 'true'
      DATABASE_PATH: /var/lib/nugaom/membership/nugaom.sqlite
    volumes:
      - customer_data:/var/lib/nugaom
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'node', 'src/forex-mt5/hosting/health.mjs']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
  scanner:
    profiles: ['scanner']
    image: nugaom-workspace:${RELEASE_TAG:-local}
    command: ['node', 'src/forex-mt5/hosting/scanner.mjs']
    restart: unless-stopped
    logging: *logging
    init: true
    env_file:
      - ${FOREX_ENV_FILE:?Set FOREX_ENV_FILE to the absolute private customer env path}
    environment:
      NODE_ENV: production
      STORAGE_PROVIDER: sqlite
      DATABASE_PATH: /var/lib/nugaom/membership/nugaom.sqlite
      AUTO_PICK_PERSISTENT_SERVER_CONFIRMED: 'true'
      FOREX_MT5_ENABLED: 'false'
      FOREX_MT5_LOCAL_MODE: 'false'
      FOREX_MT5_MEMBER_LOCAL_FILES: 'false'
      FOREX_MT5_LOCAL_FILES_PATH: ''
    volumes:
      - customer_data:/var/lib/nugaom
    depends_on:
      web:
        condition: service_healthy
  daytrade:
    profiles: ['scanner']
    image: nugaom-workspace:${RELEASE_TAG:-local}
    command: ['node', 'scripts/daytrade-worker.mjs']
    restart: unless-stopped
    logging: *logging
    init: true
    env_file:
      - ${FOREX_ENV_FILE:?Set FOREX_ENV_FILE to the absolute private customer env path}
    environment:
      NODE_ENV: production
      FOREX_MT5_DATABASE_PATH: /var/lib/nugaom/forex/bridge.sqlite
    volumes:
      - customer_data:/var/lib/nugaom
    depends_on:
      web:
        condition: service_healthy
  https:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_HOST: ${SITE_HOST:?Set the public DNS hostname}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
  backup:
    profiles: ['maintenance']
    image: nugaom-workspace:${RELEASE_TAG:-local}
    command: ['node', 'src/forex-mt5/hosting/backup.mjs']
    logging: *logging
    env_file:
      - ${FOREX_ENV_FILE:?Set FOREX_ENV_FILE to the absolute private customer env path}
    environment:
      DATABASE_PATH: /var/lib/nugaom/membership/nugaom.sqlite
      FOREX_MT5_DATABASE_PATH: /var/lib/nugaom/forex/bridge.sqlite
      FOREX_MT5_PREVIEW: 'false'
      BACKUP_DIRECTORY: /var/backups/nugaom
    volumes:
      - customer_data:/var/lib/nugaom:ro
      - ${BACKUP_HOST_DIRECTORY:-/var/backups/nugaom/encrypted}:/var/backups/nugaom
      - ./backup.mjs:/app/src/forex-mt5/hosting/backup.mjs:ro
volumes:
  customer_data:
  certificates:
  caddy_config:
