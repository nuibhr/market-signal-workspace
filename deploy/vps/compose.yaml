services:
  scanner:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    image: nugaom-scanner:${SCANNER_RELEASE:-local}
    restart: unless-stopped
    init: true
    env_file: /etc/nugaom-scanner/scanner.env
    read_only: true
    tmpfs: /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 90s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
