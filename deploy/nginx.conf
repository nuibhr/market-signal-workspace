# cloudflared public hostname should target http://127.0.0.1:8080
# Install as /etc/nginx/sites-available/nugaom and enable the site.
limit_req_zone $binary_remote_addr zone=nugaom_origin:10m rate=30r/s;
server {
    listen 127.0.0.1:8080;
    server_name _;
    client_max_body_size 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    # Do not record OAuth authorization codes or state from query strings.
    access_log off;
    error_log /var/log/nginx/nugaom-error.log warn;
    location / {
        limit_req zone=nugaom_origin burst=100 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
